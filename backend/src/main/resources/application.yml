spring:
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마 변경은 Flyway 가 담당 (운영 DB 자동 변경 금지)
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # 기존 ddl-auto 로 만들어진 DB 는 V1 을 건너뛰고 baseline 처리
    baseline-version: 1

  devtools:
    restart:
      enabled: false

jwt:
  secret: ${JWT_SECRET:baseball-recommend-jwt-secret-key-for-local-dev-only-min-32-chars!!}
  access-expiration: 3600000     # 1시간 (ms)
  refresh-expiration: 604800000  # 7일 (ms)

server:
  port: ${PORT:8080}

app:
  cors:
    # 허용할 프론트엔드 오리진 (콤마 구분). 운영에서는 CloudFront/도메인만 지정할 것
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# 헬스체크 / 모니터링 (docker healthcheck, ALB Target Group, CloudWatch 연동용)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

gemini:
  api:
    key: ${GEMINI_API_KEY:}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}

groq:
  api:
    key: ${GROQ_API_KEY:}

logging:
  level:
    com.baseball.recommend: INFO
